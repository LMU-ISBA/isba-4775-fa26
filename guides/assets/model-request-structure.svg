<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title description">
  <title id="title">The structure of one model API request</title>
  <desc id="description">One request contains an address, headers, and a JSON body. The address is the Messages API URL. Headers carry authorization, the API version, and the content type. The body identifies the model, supplies instructions and a record, and sets the output limit. Bracketed values are placeholders.</desc>
  <rect x="1" y="1" width="758" height="368" rx="12" fill="#ffffff" stroke="#9ca3af"/>
  <path d="M13 1 H747 Q759 1 759 13 V57 H1 V13 Q1 1 13 1" fill="#f3f4f6"/>
  <g stroke="#d1d5db" fill="none">
    <path d="M1 57 H759 M1 127 H759 M1 245 H759"/>
    <path d="M176 57 V369"/>
  </g>
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="36" font-size="21" font-weight="600">One request to the Claude Messages API</text>
    <g font-size="16" font-weight="600">
      <text x="24" y="98">Address (URL)</text>
      <text x="24" y="164">Headers</text>
      <text x="24" y="282">Body (JSON)</text>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="15">
      <text x="198" y="98">https://api.anthropic.com/v1/messages</text>
      <text x="198" y="164">Authorization: Bearer [key]</text>
      <text x="198" y="194">anthropic-version: [version]</text>
      <text x="198" y="224">Content-Type: application/json</text>
      <text x="198" y="282">model: model ID</text>
      <text x="198" y="312">messages: instructions and record</text>
      <text x="198" y="342">max_tokens: output limit</text>
    </g>
  </g>
</svg>
